[workspace]
members = [
    "fsc_core",
    "fsc_frontend",
    "cli",
]
resolver = "2"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1


[workspace.lints.rust]
unsafe_code = "forbid"
unused_imports = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = "allow"