[package]
name = "fsc_cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "fsc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
fsc_compiler = { path = "../fsc_compiler" }
fsc_diagnostics = { path = "../fsc_diagnostics" }
fsc_patcher = { path = "../fsc_patcher" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
